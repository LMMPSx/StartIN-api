# Configurações do Servidor
server.port=8080
spring.application.name=startin-api

# Configuração do Banco de Dados (H2 em arquivo para persistir dados entre execuções)
spring.datasource.url=jdbc:h2:file:./data/startindb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console habilitado para depuração web em http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Codificação UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Integração com Microserviço de IA Python
startin.ai.base-url=http://localhost:8000
startin.ai.timeout-seconds=30

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

