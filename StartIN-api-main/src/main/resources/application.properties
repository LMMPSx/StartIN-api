# =====================================================================
# StartIn Backend API - configuracao unica para LOCAL e RAILWAY
# Todos os valores sensiveis vem de variaveis de ambiente.
# Localmente, crie o arquivo StartIN-api-main/local.properties (ignorado
# pelo Git) com MYSQLPASSWORD=sua_senha para rodar sem variaveis de ambiente.
# =====================================================================
spring.config.import=optional:file:./local.properties,optional:file:./StartIN-api-main/local.properties

# Servidor (Railway injeta a variavel PORT automaticamente)
server.port=${PORT:8080}
server.forward-headers-strategy=framework
spring.application.name=startin-api

# Banco de Dados MySQL
# Railway: referencie as variaveis do servico MySQL no servico do backend:
#   MYSQLHOST=${{MySQL.MYSQLHOST}}  MYSQLPORT=${{MySQL.MYSQLPORT}}
#   MYSQLUSER=${{MySQL.MYSQLUSER}}  MYSQLPASSWORD=${{MySQL.MYSQLPASSWORD}}
#   MYSQLDATABASE=${{MySQL.MYSQLDATABASE}}
# Opcional: SPRING_DATASOURCE_URL sobrescreve a URL JDBC inteira.
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:startin_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQLUSER:${MYSQL_USER:root}}
spring.datasource.password=${MYSQLPASSWORD:${MYSQL_PASSWORD:}}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# JPA / Hibernate para MySQL 8
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# Codificacao UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Integracao com o Microservico de IA Python (Vercel em producao)
# Ex.: AI_BASE_URL=https://startin-ia.vercel.app
startin.ai.base-url=${AI_BASE_URL:http://localhost:8000}
startin.ai.timeout-seconds=${AI_TIMEOUT_SECONDS:300}

# CORS: lista separada por virgula de origens permitidas (aceita curingas)
# Ex.: CORS_ALLOWED_ORIGINS=https://startin.vercel.app,https://*.vercel.app
startin.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
