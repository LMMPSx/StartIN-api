# Configurações do Servidor
server.port=8080
spring.application.name=startin-api

# Configuração do Banco de Dados MySQL (MySQL Workbench)
spring.datasource.url=jdbc:mysql://localhost:3306/startin_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:P�o de queijo}

# JPA / Hibernate para MySQL 8
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Codificação UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Integração com Microserviço de IA Python
startin.ai.base-url=http://localhost:8000
startin.ai.timeout-seconds=120

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
